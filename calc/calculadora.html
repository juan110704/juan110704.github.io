<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <h2>Calculadora</h2>
        <form action="" method="get">
            <input type="text" name="num1" placeholder="Introduce el número 1" required>
            <input type="text" name="num2" placeholder="Introduce el número 2" required>
        </form>
        <br>
        <button onclick="suma()">Suma</button>
        <button onclick="resta()">Resta</button>
        <button onclick="multiplicacion()">Multiplicación</button>
        <button onclick="division()">División</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
